# Fly.io config. Run `fly launch --copy-config --no-deploy`, pick a unique app name, then follow DEPLOY.md.
app = "felt-and-fortune"
primary_region = "iad"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DATABASE_PATH = "/data/felt-and-fortune.sqlite3"
  COOKIE_SECURE = "1"

[[mounts]]
  source = "ff_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
